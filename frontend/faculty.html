<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Faculty Portal — CTED RFID</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d0118;--purple:#6c2bd9;--purple-light:#9b59f5;--blue:#2563eb;--cyan:#06b6d4;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--glass:rgba(255,255,255,0.06);--glass-border:rgba(255,255,255,0.1);--text:#fff;--muted:rgba(255,255,255,0.55);--dim:rgba(255,255,255,0.25)}
html,body{min-height:100vh;font-family:'DM Sans',sans-serif;color:var(--text);background:var(--bg)}
.bg-layer{position:fixed;inset:0;z-index:0;background:linear-gradient(135deg,#0d001f,#100222 40%,#0a1628 100%)}
.bg-layer::before{content:'';position:absolute;top:-200px;left:-200px;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(108,43,217,.25),transparent);filter:blur(60px)}
.wrapper{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:32px 24px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}
.topbar h1{font-family:'Syne',sans-serif;font-size:22px;font-weight:800}
.topbar-name{font-size:13px;color:var(--muted)}
.logout-btn{padding:8px 16px;border-radius:10px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.2);color:#fca5a5;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.logout-btn:hover{background:rgba(239,68,68,.2)}
.section-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:18px;padding:20px;margin-bottom:20px}
.section-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;margin-bottom:16px}
.class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.class-card{background:rgba(255,255,255,.04);border:1px solid var(--glass-border);border-radius:14px;padding:16px;cursor:pointer;transition:all .2s}
.class-card:hover{transform:translateY(-2px);border-color:rgba(108,43,217,.4)}
.class-card h4{font-family:'Syne',sans-serif;font-size:14px}
.class-card p{color:var(--muted);font-size:13px;margin-top:4px}
.class-card small{color:var(--dim);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
th{padding:10px 12px;text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--glass-border)}
td{padding:12px 12px;border-bottom:1px solid rgba(255,255,255,0.04)}
tr:hover td{background:rgba(255,255,255,.02)}
.status-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.status-pill.present{background:rgba(34,197,94,.15);color:#86efac}
.status-pill.late{background:rgba(245,158,11,.15);color:#fde68a}
.status-pill.absent{background:rgba(239,68,68,.15);color:#fca5a5}
.back-btn{padding:8px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:var(--muted);font-size:13px;cursor:pointer;margin-bottom:16px;transition:all .2s}
.back-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="bg-layer"></div>
<div class="wrapper">
  <div class="topbar">
    <div><h1>👨‍🏫 Faculty Portal</h1><div class="topbar-name" id="facName">Loading…</div></div>
    <button class="logout-btn" onclick="logout()">↩ Logout</button>
  </div>
  <div id="classView">
    <div class="section-card"><div class="section-title">My Classes</div><div class="class-grid" id="classGrid"><p style="color:var(--dim)">Loading classes…</p></div></div>
  </div>
  <div id="attendanceView" class="hidden">
    <button class="back-btn" onclick="showClasses()">← Back to Classes</button>
    <div class="section-card"><div class="section-title" id="attTitle">Attendance</div>
    <table><thead><tr><th>Student ID</th><th>Name</th><th>Tap Time</th><th>Status</th></tr></thead><tbody id="attBody"><tr><td colspan="4" style="text-align:center;color:var(--dim);padding:20px">Select a class</td></tr></tbody></table></div>
  </div>
</div>
<script>
const API='/api/faculty';
let userName='';

function escHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

// Auth check
fetch('/api/me',{credentials:'include'}).then(r=>r.json()).then(d=>{
  if(!d.loggedIn||d.user.role!=='faculty'){location.href='index.html';return;}
  userName=d.user.name;document.getElementById('facName').textContent=d.user.name;
  loadClasses();
});

async function loadClasses(){
  const r=await fetch(`${API}/classes`,{credentials:'include'});const d=await r.json();
  const grid=document.getElementById('classGrid');
  if(!d.success||!d.classes.length){grid.innerHTML='<p style="color:var(--dim)">No classes assigned.</p>';return;}
  grid.innerHTML=d.classes.map(c=>`
    <div class="class-card" onclick="viewAttendance(${c.schedule_id},'${escHtml(c.subject_name).replace(/'/g,"\\'")}')">
      <h4>${escHtml(c.subject_code)}: ${escHtml(c.subject_name)}</h4>
      <p>${escHtml(c.section_name)} | ${c.start_time} - ${c.end_time}</p>
      <small>${escHtml(c.location||'No Room Assigned')}</small>
    </div>`).join('');
}

async function viewAttendance(schedId,subjectName){
  document.getElementById('classView').classList.add('hidden');
  document.getElementById('attendanceView').classList.remove('hidden');
  document.getElementById('attTitle').textContent=`Attendance — ${subjectName}`;
  const r=await fetch(`${API}/attendance?schedule_id=${schedId}`,{credentials:'include'});const d=await r.json();
  const body=document.getElementById('attBody');
  if(!d.success||!d.logs.length){body.innerHTML='<tr><td colspan="4" style="text-align:center;color:var(--dim);padding:20px">No attendance records yet.</td></tr>';return;}
  body.innerHTML=d.logs.map(l=>`<tr><td>${escHtml(l.student_id)}</td><td>${escHtml(l.first_name)} ${escHtml(l.last_name)}</td>
    <td>${new Date(l.tap_time).toLocaleString('en-PH',{hour:'2-digit',minute:'2-digit'})}</td>
    <td><span class="status-pill ${l.status}">${l.status}</span></td></tr>`).join('');
}

function showClasses(){document.getElementById('classView').classList.remove('hidden');document.getElementById('attendanceView').classList.add('hidden');}
function logout(){fetch('/api/auth/logout',{method:'POST',credentials:'include'}).then(()=>location.href='index.html');}
</script>
</body>
</html>
