<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>CTED RFID Attendance System — Login</title>
  <meta name="description" content="CTED RFID Attendance System login portal for College of Teacher Education, JRMSU" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg: #0d0118;
      --purple: #6c2bd9;
      --purple-light: #9b59f5;
      --blue: #2563eb;
      --cyan: #06b6d4;
      --text: #fff;
      --muted: rgba(255, 255, 255, 0.55);
      --glass: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.1)
    }

    html,
    body {
      min-height: 100vh;
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      background: var(--bg)
    }

    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: linear-gradient(135deg, #0d001f, #100222 40%, #0a1628 100%)
    }

    .bg-layer::before {
      content: '';
      position: absolute;
      top: -200px;
      left: -200px;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(108, 43, 217, .25), transparent);
      filter: blur(60px)
    }

    .bg-layer::after {
      content: '';
      position: absolute;
      bottom: -100px;
      right: -100px;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37, 99, 235, .2), transparent);
      filter: blur(60px)
    }

    .wrapper {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      padding: 36px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .5)
    }

    .logo {
      text-align: center;
      margin-bottom: 28px
    }

    .logo-img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--purple-light);
      box-shadow: 0 0 15px rgba(108, 43, 217, .3)
    }

    .logo h1 {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 800;
      margin-top: 14px;
      background: linear-gradient(135deg, var(--purple-light), var(--cyan));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent
    }

    .logo p {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px
    }

    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 24px;
      background: rgba(255, 255, 255, .04);
      border-radius: 12px;
      padding: 4px
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: 'Syne', sans-serif
    }

    .tab.active {
      background: linear-gradient(135deg, rgba(108, 43, 217, .35), rgba(37, 99, 235, .25));
      color: #fff
    }

    .form-group {
      margin-bottom: 16px
    }

    .form-group label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--muted);
      margin-bottom: 6px
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, .07);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 12px;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
      transition: all .2s
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: var(--purple-light);
      box-shadow: 0 0 0 3px rgba(108, 43, 217, .2)
    }

    .form-group input::placeholder {
      color: rgba(255, 255, 255, .25)
    }

    .form-group select option {
      background: #1a0533
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--purple), var(--blue));
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
      letter-spacing: .3px;
      margin-top: 8px
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(108, 43, 217, .4)
    }

    .btn-submit:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none
    }

    .msg {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-top: 14px;
      display: none
    }

    .msg.show {
      display: block;
      animation: fadeIn .3s ease
    }

    .msg.success {
      background: rgba(34, 197, 94, .12);
      border: 1px solid rgba(34, 197, 94, .25);
      color: #86efac
    }

    .msg.error {
      background: rgba(239, 68, 68, .12);
      border: 1px solid rgba(239, 68, 68, .25);
      color: #fca5a5
    }

    .msg.pending {
      background: rgba(251, 191, 36, .12);
      border: 1px solid rgba(251, 191, 36, .25);
      color: #fde68a
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .hidden {
      display: none
    }
  </style>
</head>

<body>
  <div class="bg-layer"></div>
  <div class="wrapper">
    <div class="card">
      <div class="logo">
        <img src="ogol.jpg" alt="CTED" class="logo-img" onerror="this.style.display='none'" />
        <h1>CTED RFID Attendance</h1>
        <p>College of Teacher Education — JRMSU MAIN</p>
      </div>
      <div class="tabs">
        <button class="tab active" onclick="switchTab('login')" id="tab-login">Login</button>
        <button class="tab" onclick="switchTab('register')" id="tab-register">Register</button>
      </div>
      <!-- LOGIN FORM -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group"><label>Student ID</label><input type="text" id="l_sid" placeholder="e.g. 25-A-001"
            required autocomplete="username" /></div>
        <div class="form-group"><label>Password</label><input type="password" id="l_pass" placeholder="Enter password"
            required autocomplete="current-password" /></div>
        <button type="submit" class="btn-submit" id="loginBtn">⚡ Login</button>
        <div class="msg" id="loginMsg"></div>
      </form>
      <!-- REGISTER FORM -->
      <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
        <div class="form-row">
          <div class="form-group"><label>Student ID *</label><input type="text" id="r_sid" placeholder="e.g. 25-A-001"
              required /></div>
          <div class="form-group"><label>Role</label><select id="r_role">
              <option value="student">Student</option>
              <option value="faculty">Faculty</option>
            </select></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>First Name *</label><input type="text" id="r_fname" required /></div>
          <div class="form-group"><label>Last Name *</label><input type="text" id="r_lname" required /></div>
        </div>
        <div class="form-group"><label>Email</label><input type="email" id="r_email" placeholder="optional" /></div>
        <div class="form-row">
          <div class="form-group"><label>Gender</label><select id="r_gender">
              <option value="">—</option>
              <option>Male</option>
              <option>Female</option>
            </select></div>
          <div class="form-group"><label>Date of Birth</label><input type="date" id="r_dob" /></div>
        </div>
        <div class="form-group"><label>Address</label><input type="text" id="r_address" placeholder="optional" /></div>
        <div class="form-row">
          <div class="form-group"><label>Guardian Name</label><input type="text" id="r_guardian" /></div>
          <div class="form-group"><label>Contact No.</label><input type="text" id="r_contact" /></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Password *</label><input type="password" id="r_pass" placeholder="Min 8 chars"
              required minlength="8" /></div>
          <div class="form-group"><label>Re-enter Password *</label><input type="password" id="r_pass_confirm"
              placeholder="Confirm password" required minlength="8" /></div>
        </div>
        <button type="submit" class="btn-submit" id="regBtn">📝 Register</button>
        <div class="msg" id="regMsg"></div>
      </form>
    </div>
  </div>
  <script>
    const API = '/api';

    // Check if already logged in
    fetch(`${API}/me`, { credentials: 'include' }).then(r => r.json()).then(d => {
      if (d.loggedIn) {
        if (d.user.role === 'admin') location.href = 'admin.html';
        else if (d.user.role === 'faculty') location.href = 'faculty.html';
        else location.href = 'student.html';
      }
    });

    function switchTab(tab) {
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
      document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
    }

    function showMsg(id, text, type) {
      const el = document.getElementById(id);
      el.textContent = text; el.className = `msg show ${type}`;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn'); btn.disabled = true; btn.textContent = 'Logging in…';
      try {
        const r = await fetch(`${API}/auth/login`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
          body: JSON.stringify({ student_id: document.getElementById('l_sid').value, password: document.getElementById('l_pass').value })
        });
        const d = await r.json();
        if (d.success) {
          showMsg('loginMsg', 'Login successful! Redirecting…', 'success');
          setTimeout(() => {
            if (d.user.role === 'admin') location.href = 'admin.html';
            else if (d.user.role === 'faculty') location.href = 'faculty.html';
            else location.href = 'student.html';
          }, 500);
        } else {
          showMsg('loginMsg', d.message, d.status === 'pending' ? 'pending' : 'error');
          btn.disabled = false; btn.textContent = '⚡ Login';
        }
      } catch (err) { showMsg('loginMsg', 'Connection error.', 'error'); btn.disabled = false; btn.textContent = '⚡ Login'; }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const pass = document.getElementById('r_pass').value;
      const passConfirm = document.getElementById('r_pass_confirm').value;
      if (pass !== passConfirm) {
        showMsg('regMsg', 'Passwords do not match.', 'error');
        return;
      }
      const btn = document.getElementById('regBtn'); btn.disabled = true; btn.textContent = 'Registering…';
      try {
        const body = {
          student_id: document.getElementById('r_sid').value, first_name: document.getElementById('r_fname').value,
          last_name: document.getElementById('r_lname').value, password: pass,
          email: document.getElementById('r_email').value, gender: document.getElementById('r_gender').value,
          date_of_birth: document.getElementById('r_dob').value, address: document.getElementById('r_address').value,
          guardian_name: document.getElementById('r_guardian').value, contact_no: document.getElementById('r_contact').value,
          role: document.getElementById('r_role').value
        };
        const r = await fetch(`${API}/auth/register`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const d = await r.json();
        showMsg('regMsg', d.message, d.success ? 'success' : 'error');
        btn.disabled = false; btn.textContent = '📝 Register';
        if (d.success) { setTimeout(() => switchTab('login'), 2000); }
      } catch (err) { showMsg('regMsg', 'Connection error.', 'error'); btn.disabled = false; btn.textContent = '📝 Register'; }
    }
  </script>
</body>

</html>
